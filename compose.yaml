name: ripweaver-catalogue

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build: .
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      CATALOGUE_DATABASE_URL: ${CATALOGUE_DATABASE_URL:?set CATALOGUE_DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

  api:
    build: .
    restart: unless-stopped
    environment:
      CATALOGUE_DATABASE_URL: ${CATALOGUE_DATABASE_URL:?set CATALOGUE_DATABASE_URL in .env}
      CATALOGUE_SUBMISSION_TOKEN: ${CATALOGUE_SUBMISSION_TOKEN:?set CATALOGUE_SUBMISSION_TOKEN in .env}
      CATALOGUE_ADMIN_TOKEN: ${CATALOGUE_ADMIN_TOKEN:?set CATALOGUE_ADMIN_TOKEN in .env}
      CATALOGUE_ALLOWED_HOSTS: ${CATALOGUE_ALLOWED_HOSTS:-api.ripweaver.com,localhost,127.0.0.1}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend
    security_opt:
      - no-new-privileges:true

  backup:
    image: postgres:17-alpine
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/backup-postgres.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - database

networks:
  frontend:
  database:
    internal: true

volumes:
  postgres-data:
